services:
  - type: web
    name: daily-market-update
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-20250514
      - key: PYTHON_VERSION
        value: "3.12.8"
    # WeasyPrint native deps on Render
    aptPackages:
      - libpango-1.0-0
      - libpangocairo-1.0-0
      - libgdk-pixbuf-2.0-0
      - libffi-dev
      - shared-mime-info
      - fonts-dejavu-core
